# Ajustado para maquinas com 8 GB de RAM (o template do Flutter usa -Xmx8G e derruba o daemon).
org.gradle.jvmargs=-Xmx2G -XX:MaxMetaspaceSize=1G -XX:ReservedCodeCacheSize=256m -XX:+HeapDumpOnOutOfMemoryError
# Compila Kotlin dentro do daemon do Gradle (sem um daemon Kotlin extra ocupando memoria).
kotlin.compiler.execution.strategy=in-process
# Menos tarefas em paralelo = menos pico de memoria (o build de assets nativos do llama.cpp e pesado).
org.gradle.workers.max=2
android.useAndroidX=true
# This newDsl flag was added by the Flutter template
android.newDsl=false
# This builtInKotlin flag was added by the Flutter template
android.builtInKotlin=false
