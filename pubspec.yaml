name: augure_miniapps
description: AUGURE MINIAPPS - assistente de vendas por voz, offline-first (MVP).
publish_to: "none"
version: 0.1.0+1

environment:
  sdk: ">=3.12.0 <4.0.0"
  # 3.47+: Material passou para o pacote material_ui.
  flutter: ">=3.47.0"

dependencies:
  flutter:
    sdk: flutter
  material_ui: ^1.1.0
  # Voz via sistema operacional (fallback offline quando o pacote de idioma esta instalado).
  speech_to_text: ^7.0.0
  flutter_tts: ^4.2.0
  # Fase 2: LLM local (GGUF via llama.cpp). Atualizar os pacotes flutter_edge_ai_* juntos.
  # (flutter_gemma foi renomeado para flutter_edge_ai.)
  flutter_edge_ai: ^2.7.1
  flutter_edge_ai_llama: ^0.2.0
  # Fase 3 (nao incluido): STT whisper.cpp / sherpa-onnx e TTS Piper pt-BR.

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
