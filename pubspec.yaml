name: augure_miniapps
description: AUGURE MINIAPPS - assistente de vendas por voz, offline-first (MVP).
publish_to: "none"
version: 0.1.0+1

environment:
  sdk: ">=3.3.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  # Voz via sistema operacional (fallback offline quando o pacote de idioma esta instalado).
  speech_to_text: ^7.0.0
  flutter_tts: ^4.2.0
  # Fase 2 (nao incluido no esqueleto): flutter_gemma / sherpa_onnx / whisper.cpp

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
